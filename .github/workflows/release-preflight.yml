name: Chromascope release preflight

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - src/**
      - scripts/release.sh
      - scripts/release_helper.py
      - scripts/windows_release_helper.py
      - .github/workflows/release-preflight.yml
      - .github/workflows/release.yml
      - .github/workflows/windows-release.yml
      - .github/workflows/nightly.yml
      - docs/WINDOWS_RELEASE.md
      - docs/landing-page-contract.md
      - docs/RELEASE_CREDENTIALS.md
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

concurrency:
  group: chromascope-release-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Checkout pinned VST3 SDK
        run: |
          set -euo pipefail
          git clone https://github.com/steinbergmedia/vst3sdk.git "$RUNNER_TEMP/vst3sdk"
          git -C "$RUNNER_TEMP/vst3sdk" fetch --depth 1 origin 58f8da7936800732561402d7936584ca4505de07
          git -C "$RUNNER_TEMP/vst3sdk" checkout --detach 58f8da7936800732561402d7936584ca4505de07
          echo "VST3_SDK_DIR=$RUNNER_TEMP/vst3sdk" >> "$GITHUB_ENV"
      - name: Build and audit ad-hoc VST3 release
        run: bash scripts/release.sh --preflight --channel stable
      - name: Upload preflight bundle for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chromascope-release-preflight-${{ github.sha }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 3
