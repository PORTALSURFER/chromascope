name: Chromascope release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options: [stable, rc, nightly]
      publish:
        description: Publish after production signing and notarization
        required: true
        default: false
        type: boolean
      only_if_changed:
        description: Publish only when this channel has changed since its latest release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

concurrency:
  group: chromascope-release-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    environment: production
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Capture checked-out source SHA
        id: source_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check release source freshness
        id: gate
        env:
          ONLY_IF_CHANGED: ${{ inputs.only_if_changed }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASES_URL: https://portalsurfer.org/plugins/api/v1/products/chromascope/releases
          SOURCE_SHA: ${{ steps.source_sha.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ONLY_IF_CHANGED}" != true ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          releases_json="${RUNNER_TEMP}/chromascope-releases.json"
          curl --fail --silent --show-error --location --max-time 30 "${RELEASES_URL}" > "${releases_json}"
          python3 - "${SOURCE_SHA}" "${releases_json}" "${GITHUB_OUTPUT}" "${RELEASE_CHANNEL}" <<'PY'
          import datetime as dt
          import json
          import re
          import sys
          from pathlib import Path

          source_sha, releases_path, output_path, channel = sys.argv[1:]
          document = json.loads(Path(releases_path).read_text(encoding="utf-8"))
          releases = document.get("releases") if isinstance(document, dict) else None
          if not isinstance(releases, list):
              raise SystemExit("release history must contain a releases array")
          latest = None
          for release in releases:
              if not isinstance(release, dict) or release.get("channel") != channel:
                  continue
              source = release.get("source")
              timestamp = release.get("released_at")
              candidate = source.get("git_sha") if isinstance(source, dict) else None
              if source.get("repository") != "PORTALSURFER/chromascope" or not isinstance(timestamp, str) or not isinstance(candidate, str) or not re.fullmatch(r"[0-9a-f]{40}", candidate):
                  raise SystemExit("matching release source metadata is invalid")
              parsed = dt.datetime.fromisoformat(timestamp.replace("Z", "+00:00"))
              if parsed.tzinfo is None or parsed.utcoffset() is None:
                  raise SystemExit("matching release timestamp must include a timezone")
              if latest is None or parsed > latest[0]:
                  latest = (parsed, candidate)
          with Path(output_path).open("a", encoding="utf-8") as output:
              output.write(f"should_release={str(latest is None or latest[1] != source_sha).lower()}\n")
          PY
      - name: Stop when the selected channel is unchanged
        if: steps.gate.outputs.should_release != 'true'
        run: echo "selected release channel already contains this source SHA"
      - name: Configure private git dependencies
        if: steps.gate.outputs.should_release == 'true'
        env:
          RADIANT_REPO_TOKEN: ${{ secrets.RADIANT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RADIANT_REPO_TOKEN"
          git config --global url."https://x-access-token:${RADIANT_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install Rust
        if: steps.gate.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Checkout pinned VST3 SDK
        if: steps.gate.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          git clone https://github.com/steinbergmedia/vst3sdk.git "$RUNNER_TEMP/vst3sdk"
          git -C "$RUNNER_TEMP/vst3sdk" fetch --depth 1 origin 58f8da7936800732561402d7936584ca4505de07
          git -C "$RUNNER_TEMP/vst3sdk" checkout --detach 58f8da7936800732561402d7936584ca4505de07
          echo "VST3_SDK_DIR=$RUNNER_TEMP/vst3sdk" >> "$GITHUB_ENV"
      - name: Produce and optionally publish Chromascope release
        if: steps.gate.outputs.should_release == 'true'
        env:
          PORTALSURFER_RELEASE_TOKEN: ${{ inputs.publish && secrets.PORTALSURFER_RELEASE_TOKEN || '' }}
          APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.publish }}" == true ]]; then
            bash scripts/release.sh --publish --channel "${{ inputs.channel }}"
          else
            bash scripts/release.sh --package-only --channel "${{ inputs.channel }}"
          fi
      - name: Upload immutable bundle for inspection
        if: steps.gate.outputs.should_release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chromascope-release-${{ inputs.channel }}-${{ steps.source_sha.outputs.sha }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 3
      - name: Reconcile metadata-only GitHub Release
        if: steps.gate.outputs.should_release == 'true' && inputs.publish && inputs.channel != 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))["package"]["version"])')"
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --title "${{ inputs.channel }} ${TAG}" --notes "PortalSurfer manifest release; binaries are served by PortalSurfer."
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ steps.source_sha.outputs.sha }}" --title "${{ inputs.channel }} ${TAG}" --notes "PortalSurfer manifest release; binaries are served by PortalSurfer."
          fi
