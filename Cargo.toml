[package]
name = "Chromascope"
version = "0.1.0"
edition = "2024"
authors = ["PORTALSURFER"]
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Opt-in everywhere: do not require the VST3 SDK for default builds.
vst3 = ["toybox/radiant-vst3", "dep:radiant"]
# Opt-in screenshot contract (used by the fleet harness + CI).
screenshot-test = ["toybox/screenshot-test"]

[dependencies]
toybox = { git = "https://github.com/PORTALSURFER/toybox.git", rev = "a893ff7bd6746d9ca492dbb2186b49835d9e7d2d", features = ["gui"] }
radiant = { git = "https://github.com/PORTALSURFER/radiant.git", rev = "d2ab423cf418b1687b792c5a0c99f5d4e5b23526", default-features = false, optional = true }
rustfft = "6.2.0"
