[package]
name = "Chromascope"
version = "0.1.0"
edition = "2024"
authors = ["PORTALSURFER"]
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Opt-in everywhere: do not require the VST3 SDK for default builds.
vst3 = ["toybox/radiant-vst3", "dep:radiant"]
# Opt-in screenshot contract (used by the fleet harness + CI).
screenshot-test = ["toybox/screenshot-test"]

[dependencies]
toybox = { git = "https://github.com/PORTALSURFER/toybox.git", rev = "1c40aeee6062b3bcebc2799fa2ab65cf36d160a2", features = ["gui"] }
radiant = { git = "https://github.com/PORTALSURFER/radiant.git", rev = "b21a4caa094294b3eb2b2b87f6c6bc08ced8b137", default-features = false, optional = true }
rustfft = "6.2.0"
